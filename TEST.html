<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Suma de dos números</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }

        .ventana {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }

        input {
            margin: 5px;
            padding: 5px;
            width: 150px;
        }

        button {
            padding: 8px 15px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!--Pongo este comentario como primer cambio en mi Rama1 de git -->
<div class="ventana">
    <h2>Suma de números</h2>

    <input type="number" id="num1" placeholder="Número 1"><br>
    <input type="number" id="num2" placeholder="Número 2"><br>

    <button onclick="sumar()">Sumar</button>

    <p id="resultado"></p>
</div>

<script>
    function sumar() {
        let a = Number(document.getElementById("num1").value);
        let b = Number(document.getElementById("num2").value);

        let suma = a + b;

        document.getElementById("resultado").textContent =
            "La suma es: " + suma;
    }
</script>

</body>
</html>
